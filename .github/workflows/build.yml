name: Build & release APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3

      # Clé de signature stable (secrets du dépôt). Sans ces secrets, l'APK est signé
      # avec une clé de debug jetable : chaque mise à jour imposerait une désinstallation.
      - name: Keystore
        env:
          KS_B64: ${{ secrets.WM_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "WM_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signature : clé de release"
          else
            echo "::warning::Secrets de signature absents, APK signé avec une clé de debug."
          fi

      - name: Build
        env:
          WM_KEYSTORE_PASSWORD: ${{ secrets.WM_KEYSTORE_PASSWORD }}
          WM_KEY_ALIAS: ${{ secrets.WM_KEY_ALIAS }}
          WM_KEY_PASSWORD: ${{ secrets.WM_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "WM_Opener-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: wm-opener-apk
          path: WM_Opener-*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: WM_Opener-*.apk
          body_path: RELEASE_NOTES.md
