name: Build & release APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Tag de release à créer (ex. v1.0.0). Vide = simple build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }

      # Clé de signature stable (secrets du dépôt). Sans ces secrets, l'APK est signé
      # avec une clé de debug jetable : chaque mise à jour imposerait une désinstallation.
      - name: Keystore
        env:
          KS_B64: ${{ secrets.WM_KEYSTORE_B64 }}
          WM_KEYSTORE_PASSWORD: ${{ secrets.WM_KEYSTORE_PASSWORD }}
          WM_KEY_ALIAS: ${{ secrets.WM_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            # Tolère espaces et retours à la ligne ajoutés lors du collage du secret.
            if ! printf '%s' "$KS_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
              echo "::error::WM_KEYSTORE_B64 n'est pas du base64 valide (attendu : tout le contenu de wm_release.jks.b64, sans guillemets)."
              exit 1
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$WM_KEYSTORE_PASSWORD" -alias "$WM_KEY_ALIAS" > /dev/null 2>&1; then
              echo "::error::Keystore lu, mais mot de passe (WM_KEYSTORE_PASSWORD) ou alias (WM_KEY_ALIAS) incorrect."
              exit 1
            fi
            echo "WM_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signature : clé de release"
          else
            echo "::warning::Secrets de signature absents, APK signé avec une clé de debug."
          fi

      - name: Build
        env:
          WM_KEYSTORE_PASSWORD: ${{ secrets.WM_KEYSTORE_PASSWORD }}
          WM_KEY_ALIAS: ${{ secrets.WM_KEY_ALIAS }}
          WM_KEY_PASSWORD: ${{ secrets.WM_KEY_PASSWORD }}
          NAME: ${{ inputs.release || github.ref_name }}
        run: |
          # SDK Android préinstallé sur les runners ubuntu (ANDROID_HOME).
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          case "$NAME" in *[!A-Za-z0-9._/-]*) echo "Nom invalide"; exit 1;; esac
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "WM_Opener-${NAME//\//-}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: wm-opener-apk
          path: WM_Opener-*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: WM Opener ${{ inputs.release || github.ref_name }}
          files: WM_Opener-*.apk
          body_path: RELEASE_NOTES.md
